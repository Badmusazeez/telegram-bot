[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mexc-ai-trading-assistant"
version = "1.0.0"
description = "Institutional AI trading assistant for MEXC USDT-M Futures"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.9.0",
  "websockets>=12.0",
  "pydantic>=2.6.0",
  "pydantic-settings>=2.2.0",
  "PyYAML>=6.0.1",
  "numpy>=1.26.0",
  "pandas>=2.2.0",
  "python-telegram-bot>=21.0",
  "structlog>=24.1.0",
  "tenacity>=8.2.3",
  "orjson>=3.9.0",
  "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=4.1.0",
  "ruff>=0.3.0",
]

[project.scripts]
mexc-assistant = "mexc_assistant.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
